<!DOCTYPE html>
<html lang = "en" >
   <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="home.css">
      <title>Event Management System seminar page</title>
   </head>
    
   <body>

      <header class="seminartop">
                <img src="itum logo.png" class="logo">
                <h1 class="toptitle">Seminar</h1>
      </header>

      

        <div class="mainbuttons">
                      
                      <button>Home</button>
                      <button>Events</button>
                      <button>Admin</button>
        </div>        

        <p>This page displays complete details about all seminar events. Choose 
         your Division and Academic Year to find relevent seminars. Click the Participate
         button after view details about the event to confirm your attendens.
      </p>

        <section class="firstpart">
             <div class="Row">  
                       <label>Academic Year :</label>
                       <select name="dropdown">
                            <option value="selectY">Select your Academic Year</option>
                            <option value="2023">2023</option>
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                       </select>
                       <br>
                    </div>

                    <div class="Row">
                       <label>Divistion:</label>                     
                       <select name="dropdown">
                            <option value="selectD">Select your Divition</option>
                            <option value="IT">Information Technology</option>
                            <option value="civil">Civil Engineering</option>
                            <option value="mechanical">Mecanical Engineering</option>
                       </select>
                       <br>
                    </div>                  
        </section>

        
        
   </body>

</html>
